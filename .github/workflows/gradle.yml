name: Build Flashback

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Flashback
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Upload Flashback JAR
        uses: actions/upload-artifact@v4
        with:
          name: Flashback-build
          path: build/libs/*.jar
